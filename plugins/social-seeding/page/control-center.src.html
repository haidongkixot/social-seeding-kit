<title>Seeding Control Center</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout concept: an operations console. A slim header (brand, language, sync state), a tab rail, then one working surface per tab.
   Ink-navy text on a cool paper ground, one signal-blue accent; green/amber/red are reserved for health and state. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #f8f9fc; --ink: #142033; --mute: #566782; --line: #dbe1ea;
  --accent: #1d54d4; --accent-ink: #ffffff; --accent-soft: #e5ecfb;
  --good: #14744a; --good-soft: #dff3e8; --warn: #8f5b00; --warn-soft: #fff0d0; --bad: #b0241c; --bad-soft: #fde3e0;
  --fb-bg: #f0f2f5; --fb-ink: #050505; --fb-mute: #65676b; --fb-blue: #1877f2;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1521; --surface: #162030; --surface-2: #1b2739; --ink: #e7ecf4; --mute: #9aa9bf; --line: #27344a;
    --accent: #7599f2; --accent-ink: #0a1120; --accent-soft: #1d2d52;
    --good: #55c98d; --good-soft: #17382a; --warn: #f0b955; --warn-soft: #3d2f10; --bad: #f08a82; --bad-soft: #43201d;
    --fb-bg: #18191a; --fb-ink: #e4e6eb; --fb-mute: #b0b3b8; --fb-blue: #4599ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1521; --surface: #162030; --surface-2: #1b2739; --ink: #e7ecf4; --mute: #9aa9bf; --line: #27344a;
  --accent: #7599f2; --accent-ink: #0a1120; --accent-soft: #1d2d52;
  --good: #55c98d; --good-soft: #17382a; --warn: #f0b955; --warn-soft: #3d2f10; --bad: #f08a82; --bad-soft: #43201d;
  --fb-bg: #18191a; --fb-ink: #e4e6eb; --fb-mute: #b0b3b8; --fb-blue: #4599ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 20px; } h3 { font-size: 15px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.tbl td .mono { overflow-wrap: normal; }
a { color: var(--accent); }
#langsel { width: auto; }
.mute { color: var(--mute); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 18px 0 12px; }
.brandmark { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 280px; }
.brandmark h1 { font-size: 22px; overflow-wrap: anywhere; }
.brandmark .tag { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
.top-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.syncpill { font: 500 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--mute); }
.syncpill.ok { color: var(--good); background: var(--good-soft); border-color: transparent; }
.syncpill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-weight: 500; }
.banner.paused { background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--ink); font-weight: 400; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 18px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--mute); font-weight: 500; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
.count { font: 500 11px/1 var(--f-mono); background: var(--accent-soft); color: var(--ink); border-radius: 99px; padding: 3px 7px; }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 13px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--mute); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn.on-good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.on-warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.on-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
input[type=text], input[type=url], input[type=email], input[type=time], input[type=date], input[type=number], select, textarea {
  width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
textarea { resize: vertical; min-height: 84px; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--mute); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lbl { font-weight: 500; font-size: 12.5px; }
.hint { color: var(--mute); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.chk { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.lede { color: var(--mute); margin-top: 4px; max-width: 70ch; }
.empty { padding: 28px 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 10px; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 16px; margin-bottom: 4px; }
.errors { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 14px; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
.savebar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-top: 16px; margin-top: 18px; border-top: 1px solid var(--line); }
.unsaved { color: var(--warn); font-weight: 500; }

/* setup */
.setup { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 7px; cursor: pointer; display: flex; gap: 10px; align-items: center; color: var(--mute); }
.step[aria-current="step"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 500 11px/1 var(--f-mono); flex: none; }
.step .dot.done { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.list-row { display: grid; gap: 10px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; min-width: 560px; }
.tbl th { text-align: left; font: 500 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td select, .tbl td input { min-width: 96px; padding: 4px 6px; }
.tbl td input[type=checkbox], .tbl td input[type=radio] { min-width: 0; width: 16px; padding: 0; }
.tbl td .chk span { white-space: nowrap; }
.tbl a { color: var(--accent); }
.pill { display: inline-block; font: 500 11.5px/1 var(--f-mono); padding: 4px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--accent-soft); border-color: transparent; }

/* dashboard */
.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.subnav button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; color: var(--mute); }
.subnav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.kpi .n { font: 600 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--mute); font-size: 12.5px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
.funnel { display: flex; flex-direction: column; gap: 8px; }
.frow { display: grid; grid-template-columns: 96px minmax(0, 1fr) 70px; gap: 10px; align-items: center; }
.frow .bar { height: 14px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.frow .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); border-right: 2px solid var(--accent); }
.frow .bar i.now { background: var(--accent); opacity: .85; border: 0; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--warn); margin-top: 2px; }
.tick.done { background: var(--good); border-color: var(--good); }
.timeline { display: flex; gap: 4px; flex-wrap: wrap; }
.timeline i { width: 16px; height: 16px; border-radius: 3px; display: block; }
.timeline i.GREEN { background: var(--good); } .timeline i.AMBER { background: var(--warn); } .timeline i.RED { background: var(--bad); }

/* approvals */
.appr-list { display: flex; flex-direction: column; gap: 18px; }
.appr { align-items: start; display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 20px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.appr.marked-approve { border-color: var(--good); } .appr.marked-drop { border-color: var(--bad); } .appr.marked-edit { border-color: var(--warn); }
.fb { background: var(--fb-bg); border-radius: 8px; padding: 10px; }
.fbcard { background: var(--surface); border-radius: 8px; padding: 12px 14px 4px; box-shadow: 0 1px 2px rgba(0,0,0,.18); color: var(--fb-ink); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
.fbcard .hd { display: flex; gap: 8px; align-items: center; }
.fbcard .av { width: 38px; height: 38px; border-radius: 50%; background: var(--fb-blue); color: #fff; font-weight: 700; display: grid; place-items: center; flex: none; }
.fbcard .nm { font-weight: 600; font-size: 14.5px; color: var(--ink); } .fbcard .nm span { font-weight: 400; color: var(--fb-mute); }
.fbcard .sub { font-size: 12.5px; color: var(--fb-mute); }
.fbcard .tx { font-size: 15px; line-height: 1.4; color: var(--ink); margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.fbcard .ft { border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 6px 0; color: var(--fb-mute); font-weight: 600; font-size: 13.5px; }
.meaning { padding: 10px 12px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.decide { display: flex; gap: 8px; flex-wrap: wrap; }
.summary-bar { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }

/* control */
.big-toggle { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.state-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; background: var(--good); }
.state-dot.paused { background: var(--warn); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 20; max-width: calc(100vw - 32px); }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 760px) {
  .setup { grid-template-columns: minmax(0, 1fr); }
  .steps { flex-direction: row; overflow-x: auto; gap: 4px; }
  .step { width: auto; white-space: nowrap; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .appr { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 14px; }
  .frow { grid-template-columns: 78px minmax(0, 1fr) 56px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
const I18N = /*I18N*/{};
</script>
<script>
"use strict";
/* ---------------------------------------------------------------- basics */
const TABS = ["setup", "channels", "approvals", "dashboard", "control"];
const COLS = ["config", "summary", "groups", "runs", "scans", "conversations", "queue", "funnel", "posts", "health",
  "incidents", "readiness", "knowledge", "memberCounts", "links", "leads", "approvals", "control", "runRequests", "notes"];
const STAGES = ["0", "1", "2", "3", "4", "X"];
const DEST_TYPES = ["whatsapp", "telegram", "zalo", "messenger", "website"];
const DEST_PREFIX = { whatsapp: "https://chat.whatsapp.com/", telegram: "https://t.me/", zalo: "https://zalo.me/", messenger: "https://m.me/" };
const KINDS = ["discussion", "board", "page"];
const STATES = ["not_joined", "pending", "active", "cooldown", "retired"];
const WAVES = ["pilot", "w2", "w3", "w4"];
const TRI = ["yes", "no", "unknown"];
const REQUEST_KINDS = ["daily-run", "hot-replies", "check-replies", "health-check"];
const PRESETS = {
  careful: { "identity.personal.max_items_per_day": 8, "identity.personal.max_offer_posts_per_day": 2, "per_group.max_items_per_day": 2, "content.max_link_share": 0.30, "per_group.warmup_days": 14 },
  normal: { "identity.personal.max_items_per_day": 12, "identity.personal.max_offer_posts_per_day": 3, "per_group.max_items_per_day": 3, "content.max_link_share": 0.40, "per_group.warmup_days": 10 },
};
const LANG_RE = /^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$/;
const FB_RE = /^https:\/\/(www\.|m\.|web\.)?facebook\.com\/\S+/;

let lang = "en";
function t(k, v) {
  let s = (I18N[lang] && I18N[lang][k]) ?? (I18N.en && I18N.en[k]) ?? k;
  if (v) for (const [a, b] of Object.entries(v)) s = s.split("{" + a + "}").join(b);
  return s;
}
function el(tag, a, ...kids) {
  const n = document.createElement(tag);
  if (a) for (const [k, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k in n && k !== "list" && k !== "form") n[k] = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const clone = (o) => JSON.parse(JSON.stringify(o));
const today = () => new Date().toISOString().slice(0, 10);
const slug = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const validTz = (z) => { try { new Intl.DateTimeFormat("en", { timeZone: z }); return true; } catch { return false; } };

/* ---------------------------------------------------------------- state */
const D = {}; COLS.forEach((c) => (D[c] = []));
const loaded = {};
let db = null, userApi = null, myId = "", canWrite = false, dbError = "";
let tab = "setup", step = 0, dashSection = "overview";
const draft = {}; const dirty = new Set();
let formErrors = [];
const cfg = (id) => D.config.find((d) => d.id === id);
const draftOf = (id) => { if (!(id in draft)) draft[id] = cfg(id) ? clone(cfg(id)) : null; return draft[id]; };
const one = (c, id) => D[c].find((d) => d.id === id);
const brandDoc = () => draftOf("brand") || cfg("brand") || {};
const summary = () => D.summary.find((d) => d.id === "summary") || {};

function pickLang() {
  if (window.__SSK_LANG) return window.__SSK_LANG;   // set only by the local test stub
  let l = "";
  try { l = localStorage.getItem("ssk-lang") || ""; } catch (e) { /* no storage */ }
  if (!I18N[l]) l = (cfg("brand") || {}).ui_language || summary().ui_language || "";
  if (!I18N[l]) l = (navigator.language || "en").slice(0, 2);
  return I18N[l] ? l : "en";
}

let toastTimer;
function toast(msg, bad) {
  document.querySelectorAll(".toast").forEach((n) => n.remove());
  const n = el("div", { class: "toast" + (bad ? " bad" : ""), role: "status", text: msg });
  document.body.append(n);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => n.remove(), 3500);
}

async function write(path, data) {
  if (!db || !canWrite) { toast(t("readonly"), true); return false; }
  try { await db.doc(path).set(data); return true; }
  catch (e) { toast(t("write_failed", { code: (e && e.code) || "error" }), true); return false; }
}
async function remove(path) {
  if (!db || !canWrite) return false;
  try { await db.doc(path).delete(); return true; } catch (e) { toast(t("write_failed", { code: (e && e.code) || "error" }), true); return false; }
}
const stamp = () => ({ _updated: new Date().toISOString(), _updatedBy: myId });
async function saveDocs(ids) {
  let ok = true;
  for (const id of ids) {
    const d = draft[id]; if (!d || !dirty.has(id)) continue;
    const out = { ...clone(d), ...stamp() };
    if (await write("config/" + id, out)) { dirty.delete(id); delete draft[id]; } else ok = false;
  }
  if (ok) toast(t("saved"));
  scheduleRender();
  return ok;
}
const markDirty = (id) => { dirty.add(id); const b = document.getElementById("dirtyflag"); if (b) b.hidden = false; };

/* ---------------------------------------------------------------- data wiring */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderApp(); });
}
function subscribe(c) {
  db.collection(c).onSnapshot((snap) => {
    D[c] = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    if (!snap.metadata.fromCache) loaded[c] = true;
    if (c === "config") for (const id of Object.keys(draft)) if (!dirty.has(id)) delete draft[id];
    lang = pickLang();
    scheduleRender();
  }, (e) => { dbError = (e && e.code) || "error"; scheduleRender(); });
}
async function boot() {
  lang = pickLang();
  const hash = location.hash.replace("#", "");
  if (TABS.includes(hash)) tab = hash;
  renderApp();
  try {
    userApi = await claude.use("user");
    db = await claude.use("db");
  } catch (e) { db = null; }
  if (userApi) {
    try { myId = (await userApi.id()) || ""; } catch (e) { myId = ""; }
    try { canWrite = userApi.canEdit(); } catch (e) { canWrite = false; }
  }
  if (!db) { dbError = "unavailable"; renderApp(); return; }
